<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>VoltTech Hardware</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: "#3b82f6",
              surface: "#18181b",
              background: "#09090b",
              border: "#27272a",
            },
          },
        },
      };
    </script>
    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-background text-zinc-100 min-h-screen pb-24 antialiased">
    <!-- Header -->
    <header
      class="sticky top-0 z-30 bg-background/90 backdrop-blur border-b border-border px-4 py-3"
    >
      <div class="flex items-center justify-between">
        <div>
          <h1
            class="text-lg font-bold tracking-tight text-white flex items-center gap-2"
          >
            <span>⚡</span> VoltTech Catalog
          </h1>
          <p class="text-xs text-zinc-400">Authentic Gear & Accessories</p>
        </div>
        <button
          id="cartBtn"
          class="relative p-2 rounded-xl bg-surface border border-border text-zinc-300"
        >
          🛒
          <span
            id="cartBadge"
            class="hidden absolute -top-1.5 -right-1.5 bg-brand text-white font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center"
            >0</span
          >
        </button>
      </div>

      <!-- Search & Categories -->
      <div class="mt-3 space-y-2">
        <input
          id="searchInput"
          type="text"
          placeholder="Search cables, chargers, storage..."
          class="w-full bg-surface border border-border rounded-xl px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-brand"
        />
        <div
          id="categoryContainer"
          class="flex gap-2 overflow-x-auto hide-scrollbar py-1 text-xs"
        >
          <!-- Dynamic category chips will inject here -->
        </div>
      </div>
    </header>

    <!-- Product Grid -->
    <main class="p-4">
      <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Injected via app.js -->
      </div>
    </main>

    <!-- Cart Drawer -->
    <div
      id="cartModal"
      class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex flex-col justify-end"
    >
      <div
        class="bg-surface border-t border-border rounded-t-2xl max-h-[85vh] flex flex-col w-full max-w-lg mx-auto"
      >
        <div
          class="p-4 border-b border-border flex items-center justify-between"
        >
          <h2 class="font-bold text-base text-white">Your Cart</h2>
          <button
            id="closeCartBtn"
            class="text-zinc-400 text-sm hover:text-white"
          >
            ✕ Close
          </button>
        </div>

        <div id="cartItemsList" class="p-4 overflow-y-auto space-y-3 flex-1">
          <!-- Cart items inject here -->
        </div>

        <div class="p-4 border-t border-border bg-surface/50 space-y-3">
          <div class="flex justify-between items-center text-sm font-semibold">
            <span class="text-zinc-400">Total</span>
            <span id="cartTotalPrice" class="text-lg text-brand font-bold"
              >0.00 ETB</span
            >
          </div>
          <button
            id="toCheckoutBtn"
            class="w-full bg-brand hover:bg-blue-600 text-white font-medium py-3 rounded-xl transition"
          >
            Proceed to Order Details
          </button>
        </div>
      </div>
    </div>

    <!-- Checkout Drawer -->
    <div
      id="checkoutModal"
      class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex flex-col justify-end"
    >
      <div
        class="bg-surface border-t border-border rounded-t-2xl max-h-[90vh] overflow-y-auto p-4 w-full max-w-lg mx-auto space-y-4"
      >
        <div
          class="flex items-center justify-between border-b border-border pb-3"
        >
          <h2 class="font-bold text-base text-white">Delivery Information</h2>
          <button
            id="closeCheckoutBtn"
            class="text-zinc-400 text-sm hover:text-white"
          >
            ✕ Back
          </button>
        </div>

        <form id="checkoutForm" class="space-y-3 text-sm">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1"
              >Full Name *</label
            >
            <input
              required
              id="custName"
              type="text"
              class="w-full bg-background border border-border rounded-xl px-3 py-2 text-zinc-100 focus:border-brand focus:outline-none"
              placeholder="e.g. Abebe Bikila"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1"
              >Phone Number *</label
            >
            <input
              required
              id="custPhone"
              type="tel"
              class="w-full bg-background border border-border rounded-xl px-3 py-2 text-zinc-100 focus:border-brand focus:outline-none"
              placeholder="09..."
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1"
              >Delivery Address *</label
            >
            <textarea
              required
              id="custAddress"
              rows="2"
              class="w-full bg-background border border-border rounded-xl px-3 py-2 text-zinc-100 focus:border-brand focus:outline-none"
              placeholder="Subcity, Woreda, Landmark"
            ></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1"
              >Delivery Instructions (Optional)</label
            >
            <input
              id="custNotes"
              type="text"
              class="w-full bg-background border border-border rounded-xl px-3 py-2 text-zinc-100 focus:border-brand focus:outline-none"
              placeholder="Call before arrival, gate code, etc."
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1"
              >Payment Method</label
            >
            <div class="grid grid-cols-2 gap-2">
              <label
                class="border border-border rounded-xl p-3 flex flex-col items-center gap-1 cursor-pointer hover:border-brand has-[:checked]:border-brand has-[:checked]:bg-brand/10"
              >
                <input
                  type="radio"
                  name="paymentMethod"
                  value="MOBILE_MONEY"
                  checked
                  class="hidden"
                />
                <span class="text-xs font-semibold">Telebirr / CBE</span>
                <span class="text-[10px] text-zinc-400"
                  >Direct bank transfer</span
                >
              </label>
              <label
                class="border border-border rounded-xl p-3 flex flex-col items-center gap-1 cursor-pointer hover:border-brand has-[:checked]:border-brand has-[:checked]:bg-brand/10"
              >
                <input
                  type="radio"
                  name="paymentMethod"
                  value="COD"
                  class="hidden"
                />
                <span class="text-xs font-semibold">Cash On Delivery</span>
                <span class="text-[10px] text-zinc-400">Pay upon dropoff</span>
              </label>
            </div>
          </div>

          <button
            type="submit"
            id="submitOrderBtn"
            class="w-full mt-4 bg-brand hover:bg-blue-600 text-white font-semibold py-3 rounded-xl transition flex justify-center items-center gap-2"
          >
            <span>Confirm & Transmit Order</span>
          </button>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
